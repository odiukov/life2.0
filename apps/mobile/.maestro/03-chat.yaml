appId: app.lifeagents.mobile
name: Task streams a completed assistant answer
---
- launchApp
- runFlow: shared/dismiss-dev-overlays.yaml
- tapOn:
    id: 'task-button'
- assertVisible:
    id: 'task-sheet'
- tapOn:
    id: 'ask-input'
- inputText: 'How did I sleep this week?'
- tapOn:
    id: 'ask-send'
- extendedWaitUntil:
    visible:
      id: 'task-assistant-complete'
    timeout: 60000
- takeScreenshot: screenshots/task-answer
- tapOn:
    id: 'task-close'
- tapOn: 'End'
- assertNotVisible:
    id: 'task-sheet'
