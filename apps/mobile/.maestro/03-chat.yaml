appId: app.lifeagents.mobile
name: Chat streams an answer from the orchestrator
---
- launchApp
- runFlow: shared/dismiss-dev-overlays.yaml
- tapOn:
    text: "Chat, tab.*"
- assertVisible: "Agent status.*"
- tapOn: ".*Ask anything.*"
- inputText: "How did I sleep this week?"
# Enter inserts a newline in the composer; the send button is the round control
# at the trailing edge of the input.
- tapOn:
    point: 90%, 55%
- hideKeyboard
# The orchestrator consults the sleep agent before answering, so allow for a
# full round trip through the LLM provider.
- extendedWaitUntil:
    visible: ".*How did I sleep this week\\?.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 60000
- takeScreenshot: screenshots/chat
