appId: app.lifeagents.mobile
name: Me opens the agent pager
---
- launchApp
- runFlow: shared/dismiss-dev-overlays.yaml
- tapOn:
    id: 'ring-hrv'
- assertVisible:
    id: 'agent-pager'
- assertVisible: '.*Sleep.*2/.*'
- assertVisible: 'AT A GLANCE'
- tapOn: 'Next agent'
- assertVisible: '.*Workout.*3/.*'
- takeScreenshot: screenshots/agent-detail
- tapOn:
    point: 50%, 5%
- assertNotVisible:
    id: 'agent-pager'
