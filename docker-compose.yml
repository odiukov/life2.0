services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-sleep:
    build:
      context: .
      dockerfile: agents/sleep/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-workout:
    build:
      context: .
      dockerfile: agents/workout/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-nutrition:
    build:
      context: .
      dockerfile: agents/nutrition/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SYNC_SERVICE_URL: http://sync-service:8080
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-body:
    build:
      context: .
      dockerfile: agents/body/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SYNC_SERVICE_URL: http://sync-service:8080
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-mood:
    build:
      context: .
      dockerfile: agents/mood/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-habits:
    build:
      context: .
      dockerfile: agents/habits/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-recovery:
    build:
      context: .
      dockerfile: agents/recovery/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-medication:
    build:
      context: .
      dockerfile: agents/medication/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MEDICATION_AGENT_URL: http://agent-medication:8008/
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  calendar-mcp:
    build:
      context: ./calendar-mcp
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      GOOGLE_OAUTH_CREDENTIALS: /app/gcp-oauth.keys.json
    volumes:
      - ./gcp-oauth.keys.json:/app/gcp-oauth.keys.json:ro
      - ./mcp-config/calendar-mcp:/home/nodejs/.config/google-calendar-mcp
    ports:
      - "9100:3000"
      - "3500-3505:3500-3505"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENT_URLS: "http://agent-sleep:8001,http://agent-workout:8002,http://agent-nutrition:8003,http://agent-body:8004,http://agent-mood:8005,http://agent-habits:8006,http://agent-recovery:8007,http://agent-medication:8008"
      MCP_GOOGLE_CALENDAR_URL: ${MCP_GOOGLE_CALENDAR_URL}
      MCP_GOOGLE_CALENDAR_TRANSPORT: ${MCP_GOOGLE_CALENDAR_TRANSPORT}
      HA_BASE_URL: ${HA_BASE_URL}
      HA_TOKEN: ${HA_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      agent-sleep:
        condition: service_healthy
      agent-workout:
        condition: service_healthy
      agent-nutrition:
        condition: service_healthy
      agent-body:
        condition: service_healthy
      agent-mood:
        condition: service_healthy
      agent-habits:
        condition: service_healthy
      agent-recovery:
        condition: service_healthy
      agent-medication:
        condition: service_healthy
      calendar-mcp:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    env_file:
      - .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      MOOD_AGENT_URL: http://agent-mood:8005/
      HABITS_AGENT_URL: http://agent-habits:8006/
      MEDICATION_AGENT_URL: http://agent-medication:8008/
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    depends_on:
      orchestrator:
        condition: service_started
      agent-mood:
        condition: service_started
      agent-habits:
        condition: service_started
      agent-medication:
        condition: service_started
    restart: unless-stopped

  agui-frontend:
    build:
      context: ./agui-frontend
    ports:
      - "3000:80"
    depends_on:
      orchestrator:
        condition: service_started
      copilotkit-runtime:
        condition: service_started
    restart: unless-stopped

  copilotkit-runtime:
    build: ./copilotkit-runtime
    environment:
      ORCHESTRATOR_AGUI_URL: http://orchestrator:8000/agui
    depends_on:
      orchestrator:
        condition: service_started
    restart: unless-stopped

  sync-service:
    build: ./sync_service
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      YAZIO_EMAIL: ${YAZIO_EMAIL}
      YAZIO_PASSWORD: ${YAZIO_PASSWORD}
      BRIEFING_LOCAL_HOUR: "9"
      BRIEFING_TZ: "Europe/Lisbon"
      ORCHESTRATOR_URL: http://orchestrator:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      MOOD_EVENING_CHECKIN: ${MOOD_EVENING_CHECKIN}
      MOOD_EVENING_CHECKIN_TIME: ${MOOD_EVENING_CHECKIN_TIME}
      MOOD_EVENING_CHECKIN_TZ: ${MOOD_EVENING_CHECKIN_TZ}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
