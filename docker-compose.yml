services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - sh
      - -c
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-sleep:
    build:
      context: .
      dockerfile: agents/sleep/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-workout:
    build:
      context: .
      dockerfile: agents/workout/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-nutrition:
    build:
      context: .
      dockerfile: agents/nutrition/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SYNC_SERVICE_URL: http://sync-service:8080
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  agent-body:
    build:
      context: .
      dockerfile: agents/body/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SYNC_SERVICE_URL: http://sync-service:8080
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      sync-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENT_URLS: "http://agent-sleep:8001,http://agent-workout:8002,http://agent-nutrition:8003,http://agent-body:8004"
    ports:
      - "8000:8000"
    depends_on:
      agent-sleep:
        condition: service_healthy
      agent-workout:
        condition: service_healthy
      agent-nutrition:
        condition: service_healthy
      agent-body:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    env_file:
      - .env
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      orchestrator:
        condition: service_started
    restart: unless-stopped

  agui-frontend:
    build:
      context: ./agui-frontend
    ports:
      - "3000:80"
    depends_on:
      orchestrator:
        condition: service_started
      copilotkit-runtime:
        condition: service_started
    restart: unless-stopped

  copilotkit-runtime:
    build: ./copilotkit-runtime
    environment:
      ORCHESTRATOR_AGUI_URL: http://orchestrator:8000/agui
    depends_on:
      orchestrator:
        condition: service_started
    restart: unless-stopped

  sync-service:
    build: ./sync_service
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      YAZIO_EMAIL: ${YAZIO_EMAIL}
      YAZIO_PASSWORD: ${YAZIO_PASSWORD}
      SYNC_HOUR: "6"
      BRIEFING_LOCAL_HOUR: "9"
      BRIEFING_TZ: "Europe/Lisbon"
      ORCHESTRATOR_URL: http://orchestrator:8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
