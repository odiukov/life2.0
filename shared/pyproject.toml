[project]
name = "shared"
version = "0.2.0"
description = "Shared ports, adapters and legacy helpers for life2.0 services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk>=0.3.26,<1.0",
    "alembic>=1.20",
    "anthropic>=0.39",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.32",
    "babel>=2.18",
    "cryptography>=43",
    "fastapi>=0.111",
    "httpx>=0.27",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.3",
    "opentelemetry-api>=1.27",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "qdrant-client>=1.9",
    "rapidfuzz>=3.9",
    "sqlalchemy[asyncio]>=2.1,<3",
    "structlog>=26.1",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2.165"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
