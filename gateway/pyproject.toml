[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["shared", "household", "fastapi>=0.111", "httpx>=0.27", "python-multipart>=0.0.9"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv.sources]
shared = { workspace = true }
household = { workspace = true }
