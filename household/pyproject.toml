[project]
name = "household"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["shared", "fastapi>=0.111"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household"]

[tool.uv.sources]
shared = { workspace = true }
