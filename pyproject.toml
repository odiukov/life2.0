[project]
name = "life-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "household",
    "gateway",
    "orchestrator",
    "sync_service",
    "agents/sleep",
    "agents/workout",
    "agents/nutrition",
    "agents/body",
    "agents/mood",
    "agents/habits",
    "agents/recovery",
    "agents/medication",
    "agents/kitchen",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pyyaml>=6.0",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.15",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "shared/src"]
testpaths = ["tests", "shared/tests", "agents/nutrition/tests", "household/tests", "gateway/tests", "agents/kitchen/tests"]
addopts = "--import-mode=importlib -ra -p shared.testing.pytest_plugin"
consider_namespace_packages = true
markers = [
    "integration: needs Docker (testcontainers PostgreSQL)",
    "evals: calls a real LLM; run manually with `make evals`",
]

[tool.importlinter]
root_packages = ["shared", "nutrition", "household", "gateway", "kitchen"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Ports do not depend on adapters"
type = "forbidden"
source_modules = ["shared.ports"]
forbidden_modules = ["shared.adapters", "shared.schema", "sqlalchemy", "asyncpg", "qdrant_client"]

[[tool.importlinter.contracts]]
name = "New shared code does not import legacy modules"
type = "forbidden"
# Direct imports only: shared.adapters may wrap a legacy module, and new code may use adapters.
allow_indirect_imports = true
source_modules = ["shared.ports", "shared.testing", "shared.config", "shared.observability.logging", "shared.schema", "shared.a2a", "shared.domain", "nutrition", "household", "gateway", "kitchen"]
forbidden_modules = [
    "shared.db", "shared.llm", "shared.vector", "shared.embeddings", "shared.peer",
    "shared.a2a_clients", "shared.a2a_store", "shared.intent", "shared.i18n",
    "shared.current_user", "shared.consent", "shared.consulted", "shared.log_entry",
    "shared.recovery", "shared.telemetry",
]

[[tool.importlinter.contracts]]
name = "Shared domain is pure"
type = "forbidden"
source_modules = ["shared.domain"]
forbidden_modules = ["shared.ports", "shared.adapters", "shared.a2a", "shared.schema", "pydantic", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Nutrition domain is pure"
type = "forbidden"
source_modules = ["nutrition.domain"]
forbidden_modules = [
    "nutrition.application", "nutrition.adapters", "shared", "sqlalchemy", "a2a",
]

[[tool.importlinter.contracts]]
name = "Nutrition application depends on ports, not adapters"
type = "forbidden"
source_modules = ["nutrition.application"]
forbidden_modules = ["nutrition.adapters", "shared.adapters", "shared.schema", "sqlalchemy", "httpx"]

[[tool.importlinter.contracts]]
name = "Only the nutrition composition root wires adapters"
type = "forbidden"
source_modules = ["nutrition.domain", "nutrition.application", "nutrition.adapters"]
forbidden_modules = ["nutrition.composition", "nutrition.main", "nutrition.serve"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "packages", "graphify-out", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "TID"]
# Cyrillic text in strings, comments and docstrings is intentional.
# E501: the formatter owns line length; it cannot split long string literals.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through shared.config settings, not the environment."
"os.getenv".msg = "Read configuration through shared.config settings, not the environment."

[tool.ruff.lint.per-file-ignores]
# Legacy code: formatted, not linted, until it migrates onto the foundation.
"orchestrator/**" = ["ALL"]
"sync_service/**" = ["ALL"]
"agents/sleep/**" = ["ALL"]
"agents/workout/**" = ["ALL"]
"agents/body/**" = ["ALL"]
"agents/mood/**" = ["ALL"]
"agents/habits/**" = ["ALL"]
"agents/recovery/**" = ["ALL"]
"agents/medication/**" = ["ALL"]
"agents/__init__.py" = ["ALL"]
"shared/src/shared/*.py" = ["ALL"]
"tests/**" = ["ALL"]
"scripts/**" = ["ALL"]
# The OTEL/Traceloop SDKs are configured through environment variables by design.
"shared/src/shared/observability/telemetry.py" = ["ALL"]
# The settings package is the one place that may read the environment.
"shared/src/shared/config/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["shared/src/shared", "agents/nutrition/src/nutrition", "household/src/household", "gateway/src/gateway", "agents/kitchen/src/kitchen"]
exclude = ["/alembic/versions/"]
# Source roots keep module names aligned with the editable runtime packages.
mypy_path = ["shared/src", "agents/nutrition/src", "household/src", "gateway/src", "agents/kitchen/src"]
explicit_package_bases = true
# Repositories are looked up by their Protocol type: `uow.repo(MealRepository)`.
disable_error_code = ["type-abstract"]

[[tool.mypy.overrides]]
# Legacy modules: type-checked only after they migrate.
module = [
    "shared.a2a_clients", "shared.a2a_store", "shared.consent", "shared.consulted",
    "shared.current_user", "shared.db", "shared.embeddings", "shared.grounding",
    "shared.i18n", "shared.intent", "shared.llm", "shared.log_entry", "shared.peer",
    "shared.peer_chip_rules", "shared.personas", "shared.recovery", "shared.skill_ids",
    "shared.observability.telemetry", "shared.telemetry", "shared.vector",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["traceloop.*", "apscheduler.*", "testcontainers.*", "qdrant_client.*", "claude_agent_sdk.*"]
ignore_missing_imports = true

[[tool.importlinter.contracts]]
name = "Household domain is pure"
type = "forbidden"
source_modules = ["household.domain"]
forbidden_modules = ["household.application", "household.adapters", "shared", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "Household application depends on ports, not adapters"
type = "forbidden"
source_modules = ["household.application"]
forbidden_modules = ["household.adapters", "shared.adapters", "shared.schema", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "The gateway never reads kitchen tables or imports the orchestrator"
type = "forbidden"
source_modules = ["gateway"]
forbidden_modules = ["kitchen", "orchestrator"]

[[tool.importlinter.contracts]]
name = "Kitchen domain is pure"
type = "forbidden"
source_modules = ["kitchen.domain"]
forbidden_modules = ["kitchen.application", "kitchen.adapters", "shared", "sqlalchemy", "a2a", "pydantic"]

[[tool.importlinter.contracts]]
name = "Kitchen application depends on ports, not adapters"
type = "forbidden"
source_modules = ["kitchen.application"]
forbidden_modules = ["kitchen.adapters", "shared.adapters", "shared.schema", "sqlalchemy", "httpx", "rapidfuzz"]

[[tool.importlinter.contracts]]
name = "Only the kitchen composition root wires adapters"
type = "forbidden"
source_modules = ["kitchen.domain", "kitchen.application", "kitchen.adapters"]
forbidden_modules = ["kitchen.composition", "kitchen.main", "kitchen.serve"]
