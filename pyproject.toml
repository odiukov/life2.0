[[tool.importlinter.contracts]]
name = "Only the kitchen composition root wires adapters"
type = "forbidden"
source_modules = ["kitchen.domain", "kitchen.application", "kitchen.adapters"]
forbidden_modules = ["kitchen.composition", "kitchen.main", "kitchen.serve"]

[[tool.importlinter.contracts]]
name = "stt_service stays independent and keeps faster_whisper in its recognizer"
type = "forbidden"
# The app uses the recognizer protocol; its implementation alone imports the model.
allow_indirect_imports = true
source_modules = ["stt_service.app", "stt_service.settings"]
forbidden_modules = ["faster_whisper", "shared"]

