source_modules = ["household.application"]
forbidden_modules = ["household.adapters", "shared.adapters", "shared.schema", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "The gateway never reads kitchen tables or imports the orchestrator"
type = "forbidden"
source_modules = ["gateway"]
forbidden_modules = ["kitchen", "orchestrator"]

[[tool.importlinter.contracts]]
name = "Kitchen domain is pure"
type = "forbidden"
source_modules = ["kitchen.domain"]
forbidden_modules = ["kitchen.application", "kitchen.adapters", "shared", "sqlalchemy", "a2a", "pydantic"]

