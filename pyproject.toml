[project]
name = "life-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "shared",
    "orchestrator",
    "sync_service",
    "agents/sleep",
    "agents/workout",
    "agents/nutrition",
    "agents/body",
    "agents/mood",
    "agents/habits",
    "agents/recovery",
    "agents/medication",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pyyaml>=6.0",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.15",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs Docker (testcontainers PostgreSQL)",
    "evals: calls a real LLM; run manually with `make evals`",
]
